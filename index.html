<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Онлайн-переводчик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2a2438;
      --ink-soft: #5a5168;
      --lilac: #b8a4d9;
      --lavender: #c9b8e8;
      --plum: #6d5a8d;
      --plum-deep: #4a3a66;
      --line: rgba(74, 58, 102, 0.14);
      --shadow: 0 18px 50px rgba(90, 70, 130, 0.14);
      --radius: 18px;
      --glass: rgba(255, 250, 255, 0.62);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      overflow-x: hidden;
      background:
        linear-gradient(145deg, #f4eefc 0%, #ebe3f8 35%, #e4dcf5 65%, #efe8fa 100%);
    }

    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-shimmer {
      position: absolute;
      inset: -20%;
      background:
        linear-gradient(
          115deg,
          rgba(232, 220, 255, 0.15) 0%,
          rgba(255, 240, 250, 0.45) 22%,
          rgba(210, 225, 255, 0.28) 45%,
          rgba(245, 230, 255, 0.4) 68%,
          rgba(230, 218, 255, 0.2) 100%
        );
      background-size: 220% 220%;
      animation: shimmer-flow 16s ease-in-out infinite;
      mix-blend-mode: soft-light;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(72px);
      opacity: 0.5;
      will-change: transform;
    }

    .orb-a {
      width: 46vw;
      height: 46vw;
      max-width: 540px;
      max-height: 540px;
      left: -10%;
      top: -14%;
      background: #d8c6f2;
      animation: drift-a 20s ease-in-out infinite;
    }

    .orb-b {
      width: 38vw;
      height: 38vw;
      max-width: 460px;
      max-height: 460px;
      right: -8%;
      top: 16%;
      background: #c4b4eb;
      opacity: 0.38;
      animation: drift-b 24s ease-in-out infinite;
    }

    .orb-c {
      width: 50vw;
      height: 50vw;
      max-width: 580px;
      max-height: 580px;
      left: 26%;
      bottom: -24%;
      background: #e8d8f8;
      opacity: 0.55;
      animation: drift-c 28s ease-in-out infinite;
    }

    .orb-d {
      width: 28vw;
      height: 28vw;
      max-width: 320px;
      max-height: 320px;
      left: 48%;
      top: 38%;
      background: #f0e4ff;
      opacity: 0.35;
      animation: drift-b 18s ease-in-out infinite reverse;
    }

    .bg-mesh {
      position: absolute;
      inset: 0;
      opacity: 0.2;
      background-image:
        radial-gradient(circle at 18% 22%, rgba(184, 164, 217, 0.22), transparent 30%),
        radial-gradient(circle at 82% 28%, rgba(210, 190, 245, 0.18), transparent 34%),
        linear-gradient(rgba(74, 58, 102, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 58, 102, 0.03) 1px, transparent 1px);
      background-size: auto, auto, 56px 56px, 56px 56px;
      mask-image: radial-gradient(ellipse at center, black 25%, transparent 78%);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(920px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 3.5rem 0 4rem;
    }

    .brand {
      font-family: "Literata", serif;
      font-size: clamp(2.4rem, 6.5vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      opacity: 0;
      transform: translateY(18px);
      animation: rise 0.7s ease forwards;
    }

    .brand span {
      display: inline-block;
      background: linear-gradient(120deg, #4a3a66, #6d5a8d 40%, #8b74b0 70%, #6d5a8d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: brand-shine 8s ease-in-out infinite;
      background-size: 180% 100%;
    }

    .tagline {
      margin-top: 0.85rem;
      max-width: 34ch;
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--ink-soft);
      opacity: 0;
      transform: translateY(18px);
      animation: rise 0.7s ease 0.12s forwards;
    }

    .translator {
      margin-top: 2.4rem;
      display: grid;
      gap: 1.1rem;
      opacity: 0;
      transform: translateY(22px);
      animation: rise 0.75s ease 0.22s forwards;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.2rem;
      align-items: center;
      justify-content: space-between;
    }

    .langs,
    .voices {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
    }

    .voices-label {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--plum);
      margin-right: 0.15rem;
    }

    .lang,
    .voice {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255, 250, 255, 0.7);
      color: var(--ink-soft);
      font: inherit;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.65rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .lang:hover,
    .voice:hover {
      transform: translateY(-2px);
      border-color: rgba(109, 90, 141, 0.35);
    }

    .lang.active,
    .voice.active {
      background: var(--plum);
      border-color: var(--plum);
      color: #faf7ff;
      box-shadow: 0 8px 22px rgba(109, 90, 141, 0.22);
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      align-items: stretch;
    }

    .field {
      display: flex;
      flex-direction: column;
      min-height: 280px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .field:focus-within {
      transform: translateY(-2px);
      box-shadow: 0 22px 55px rgba(90, 70, 130, 0.16);
    }

    .field-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.1rem 0.4rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--plum);
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .icon-btn {
      appearance: none;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      color: var(--plum-deep);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .icon-btn:hover {
      transform: translateY(-1px) scale(1.04);
      background: rgba(255, 255, 255, 0.85);
    }

    .icon-btn.speaking {
      color: #fff;
      background: var(--plum);
      border-color: var(--plum);
      animation: speak-pulse 1s ease-in-out infinite;
    }

    textarea,
    .output {
      flex: 1;
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 1.15rem;
      line-height: 1.55;
      padding: 0.4rem 1.1rem 1.1rem;
    }

    .output {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .output.placeholder {
      color: rgba(90, 81, 104, 0.45);
    }

    .output.reveal {
      animation: text-in 0.45s ease;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 0.85rem 1.35rem;
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }

    .btn-primary {
      background: var(--plum-deep);
      color: #faf7ff;
      box-shadow: 0 10px 24px rgba(74, 58, 102, 0.2);
    }

    .btn-primary:hover:not(:disabled) {
      background: #3f3158;
    }

    .btn-primary.loading {
      position: relative;
      padding-left: 2.4rem;
    }

    .btn-primary.loading::before {
      content: "";
      position: absolute;
      left: 1rem;
      top: 50%;
      width: 14px;
      height: 14px;
      margin-top: -7px;
      border: 2px solid rgba(250, 247, 255, 0.35);
      border-top-color: #faf7ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .btn-ghost {
      background: rgba(255, 250, 255, 0.55);
      color: var(--ink-soft);
      border: 1px solid var(--line);
    }

    .status {
      min-height: 1.25rem;
      font-size: 0.9rem;
      color: var(--ink-soft);
      transition: color 0.2s ease;
    }

    .status.error {
      color: #9b2c2c;
    }

    .footer-note {
      margin-top: 1.6rem;
      font-size: 0.85rem;
      color: rgba(90, 81, 104, 0.75);
      opacity: 0;
      animation: rise 0.7s ease 0.35s forwards;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shimmer-flow {
      0%, 100% { background-position: 0% 40%; transform: translate3d(0, 0, 0); }
      50% { background-position: 100% 60%; transform: translate3d(-1.5%, 1%, 0); }
    }

    @keyframes drift-a {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 6%) scale(1.06); }
    }

    @keyframes drift-b {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-5%, 4%) scale(1.08); }
    }

    @keyframes drift-c {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(3%, -5%) scale(1.04); }
    }

    @keyframes brand-shine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes speak-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(109, 90, 141, 0.35); }
      50% { box-shadow: 0 0 0 10px rgba(109, 90, 141, 0); }
    }

    @keyframes text-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 720px) {
      .page {
        padding-top: 2.4rem;
      }

      .panels {
        grid-template-columns: 1fr;
      }

      .field {
        min-height: 220px;
      }

      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb,
      .bg-shimmer,
      .brand,
      .brand span,
      .tagline,
      .translator,
      .footer-note,
      .output.reveal,
      .icon-btn.speaking,
      .btn-primary.loading::before {
        animation: none !important;
      }

      .brand,
      .tagline,
      .translator,
      .footer-note {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="orb orb-d"></div>
    <div class="bg-shimmer"></div>
    <div class="bg-mesh"></div>
  </div>

  <main class="page">
    <h1 class="brand"><span>Онлайн-переводчик</span></h1>
    <p class="tagline">С русского на английский, испанский, латинский и турецкий — с выбором голоса озвучки.</p>

    <section class="translator" aria-label="Переводчик">
      <div class="toolbar">
        <div class="langs" role="tablist" aria-label="Язык перевода">
          <button class="lang active" type="button" data-lang="en" role="tab" aria-selected="true">English</button>
          <button class="lang" type="button" data-lang="es" role="tab" aria-selected="false">Español</button>
          <button class="lang" type="button" data-lang="la" role="tab" aria-selected="false">Latina</button>
          <button class="lang" type="button" data-lang="tr" role="tab" aria-selected="false">Türkçe</button>
        </div>

        <div class="voices" role="group" aria-label="Голос озвучки">
          <span class="voices-label">Голос</span>
          <button class="voice active" type="button" data-gender="female" aria-pressed="true">Женский</button>
          <button class="voice" type="button" data-gender="male" aria-pressed="false">Мужской</button>
        </div>
      </div>

      <div class="panels">
        <label class="field">
          <div class="field-head">
            <span>Русский</span>
            <div class="head-actions">
              <span id="charCount">0</span>
              <button class="icon-btn" id="speakSourceBtn" type="button" title="Озвучить исходный текст" aria-label="Озвучить исходный текст">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7.5 7.5 0 0 1 0 13.42v2.06A9.5 9.5 0 0 0 14 3.23z"/></svg>
              </button>
            </div>
          </div>
          <textarea id="source" placeholder="Введите текст на русском…" maxlength="1000"></textarea>
        </label>

        <div class="field" aria-live="polite">
          <div class="field-head">
            <span id="targetLabel">English</span>
            <div class="head-actions">
              <span id="targetCode">EN</span>
              <button class="icon-btn" id="speakTargetBtn" type="button" title="Озвучить перевод" aria-label="Озвучить перевод">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7.5 7.5 0 0 1 0 13.42v2.06A9.5 9.5 0 0 0 14 3.23z"/></svg>
              </button>
            </div>
          </div>
          <div class="output placeholder" id="output">Перевод появится здесь</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="translateBtn" type="button">Перевести</button>
        <button class="btn btn-ghost" id="speakBtn" type="button">Озвучить</button>
        <button class="btn btn-ghost" id="clearBtn" type="button">Очистить</button>
        <button class="btn btn-ghost" id="copyBtn" type="button">Копировать</button>
      </div>
      <p class="status" id="status"></p>
    </section>

    <p class="footer-note">Перевод — MyMemory API, озвучка — голоса вашего браузера. Выберите женский или мужской голос перед прослушиванием.</p>
  </main>

  <script>
    const LANGS = {
      en: { name: "English", code: "EN", voice: "en-US" },
      es: { name: "Español", code: "ES", voice: "es-ES" },
      la: { name: "Latina", code: "LA", voice: "it-IT" },
      tr: { name: "Türkçe", code: "TR", voice: "tr-TR" },
    };

    const FEMALE_HINTS = [
      "female", "woman", "zira", "susan", "samantha", "victoria", "karen",
      "moira", "tessa", "fiona", "veena", "kate", "serena", "linda", "heather",
      "hazel", "aria", "jenny", "natasha", "katya", "milena", "irina", "elena",
      "sofia", "lucia", "paulina", "sabina", "yelda", "emel", "filiz", "google uk english female",
      "microsoft irina", "microsoft helena", "microsoft sabina", "microsoft Elsa",
    ];

    const MALE_HINTS = [
      "male", "man", "david", "mark", "daniel", "james", "george", "alex",
      "tom", "fred", "bruce", "lee", "ravi", "oliver", "thomas", "richard",
      "guy", "ryan", "pavel", "yuri", "dmitry", "igor", "jorge", "pablo",
      "enrique", "alvaro", "ahmet", "tolga", "google uk english male",
      "microsoft david", "microsoft pavel", "microsoft stefan", "microsoft ravi",
    ];

    const QUALITY_HINTS = [
      "natural", "neural", "premium", "enhanced", "online", "google", "microsoft",
    ];

    const source = document.getElementById("source");
    const output = document.getElementById("output");
    const statusEl = document.getElementById("status");
    const charCount = document.getElementById("charCount");
    const targetLabel = document.getElementById("targetLabel");
    const targetCode = document.getElementById("targetCode");
    const translateBtn = document.getElementById("translateBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");
    const speakBtn = document.getElementById("speakBtn");
    const speakSourceBtn = document.getElementById("speakSourceBtn");
    const speakTargetBtn = document.getElementById("speakTargetBtn");
    const langButtons = [...document.querySelectorAll(".lang")];
    const voiceButtons = [...document.querySelectorAll(".voice")];

    let targetLang = "en";
    let voiceGender = "female";
    let debounceTimer = null;
    let voices = [];

    function loadVoices() {
      voices = window.speechSynthesis?.getVoices?.() || [];
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function setOutput(text, isPlaceholder = false) {
      output.textContent = text;
      output.classList.toggle("placeholder", isPlaceholder);
      output.classList.remove("reveal");
      if (!isPlaceholder) {
        void output.offsetWidth;
        output.classList.add("reveal");
      }
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      speakSourceBtn.classList.remove("speaking");
      speakTargetBtn.classList.remove("speaking");
    }

    function matchesHints(text, hints) {
      return hints.some((hint) => text.includes(hint.toLowerCase()));
    }

    function scoreVoice(voice, langTag, gender) {
      const name = (voice.name || "").toLowerCase();
      const lang = (voice.lang || "").toLowerCase();
      const base = langTag.slice(0, 2).toLowerCase();
      let score = 0;

      if (lang === langTag.toLowerCase()) score += 40;
      else if (lang.startsWith(base + "-")) score += 30;
      else if (lang.startsWith(base)) score += 20;
      else score -= 50;

      const female = matchesHints(name, FEMALE_HINTS);
      const male = matchesHints(name, MALE_HINTS);

      if (gender === "female") {
        if (female) score += 45;
        if (male && !female) score -= 35;
      } else {
        if (male) score += 45;
        if (female && !male) score -= 35;
      }

      if (matchesHints(name, QUALITY_HINTS)) score += 25;
      if (name.includes("compact") || name.includes("eloquence")) score -= 8;
      if (voice.localService === false) score += 8;

      return score;
    }

    function pickVoice(langTag, gender) {
      if (!voices.length) return null;

      const ranked = voices
        .map((voice) => ({ voice, score: scoreVoice(voice, langTag, gender) }))
        .filter((item) => item.score > 0)
        .sort((a, b) => b.score - a.score);

      if (ranked.length) return ranked[0].voice;

      const base = langTag.slice(0, 2).toLowerCase();
      return (
        voices.find((v) => v.lang.toLowerCase() === langTag.toLowerCase()) ||
        voices.find((v) => v.lang.toLowerCase().startsWith(base)) ||
        null
      );
    }

    function speakText(text, langTag, button) {
      if (!("speechSynthesis" in window)) {
        setStatus("Озвучка не поддерживается в этом браузере.", true);
        return;
      }

      const content = (text || "").trim();
      if (!content) {
        setStatus("Нечего озвучивать.");
        return;
      }

      stopSpeech();
      loadVoices();

      const utterance = new SpeechSynthesisUtterance(content);
      utterance.lang = langTag;
      utterance.rate = 0.92;
      utterance.volume = 1;

      const voice = pickVoice(langTag, voiceGender);
      if (voice) {
        utterance.voice = voice;
        utterance.lang = voice.lang || langTag;
      }

      const name = (voice?.name || "").toLowerCase();
      const clearlyFemale = matchesHints(name, FEMALE_HINTS);
      const clearlyMale = matchesHints(name, MALE_HINTS);

      if (voiceGender === "female") {
        utterance.pitch = clearlyMale && !clearlyFemale ? 1.18 : 1.05;
      } else {
        utterance.pitch = clearlyFemale && !clearlyMale ? 0.82 : 0.92;
      }

      utterance.onstart = () => button?.classList.add("speaking");
      utterance.onend = () => {
        button?.classList.remove("speaking");
        setStatus("Озвучка завершена");
      };
      utterance.onerror = () => {
        button?.classList.remove("speaking");
        setStatus("Не удалось озвучить текст.", true);
      };

      window.speechSynthesis.speak(utterance);
      const genderLabel = voiceGender === "female" ? "женский" : "мужской";
      const voiceName = voice ? ` (${voice.name})` : "";
      setStatus(`Озвучиваем: ${genderLabel} голос${voiceName}`);
    }

    function getTranslationText() {
      return output.classList.contains("placeholder") ? "" : output.textContent.trim();
    }

    function selectLang(lang) {
      stopSpeech();
      targetLang = lang;
      const meta = LANGS[lang];
      targetLabel.textContent = meta.name;
      targetCode.textContent = meta.code;
      langButtons.forEach((btn) => {
        const active = btn.dataset.lang === lang;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-selected", String(active));
      });
      if (source.value.trim()) {
        translate();
      }
    }

    function selectVoiceGender(gender) {
      stopSpeech();
      voiceGender = gender;
      voiceButtons.forEach((btn) => {
        const active = btn.dataset.gender === gender;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", String(active));
      });
      setStatus(gender === "female" ? "Выбран женский голос" : "Выбран мужской голос");
    }

    async function translate() {
      const text = source.value.trim();
      if (!text) {
        setOutput("Перевод появится здесь", true);
        setStatus("Введите текст для перевода.");
        return;
      }

      stopSpeech();
      translateBtn.disabled = true;
      translateBtn.classList.add("loading");
      setStatus("Переводим…");

      try {
        const url =
          "https://api.mymemory.translated.net/get?q=" +
          encodeURIComponent(text) +
          "&langpair=ru|" +
          targetLang;

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error("Сервер перевода недоступен");
        }

        const data = await response.json();
        const translated = data?.responseData?.translatedText?.trim();

        if (!translated || data.responseStatus !== 200) {
          throw new Error(data?.responseDetails || "Не удалось получить перевод");
        }

        setOutput(translated, false);
        setStatus("Готово");
      } catch (error) {
        setStatus(error.message || "Ошибка перевода", true);
      } finally {
        translateBtn.disabled = false;
        translateBtn.classList.remove("loading");
      }
    }

    function scheduleTranslate() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (source.value.trim()) {
          translate();
        }
      }, 700);
    }

    langButtons.forEach((btn) => {
      btn.addEventListener("click", () => selectLang(btn.dataset.lang));
    });

    voiceButtons.forEach((btn) => {
      btn.addEventListener("click", () => selectVoiceGender(btn.dataset.gender));
    });

    source.addEventListener("input", () => {
      charCount.textContent = String(source.value.length);
      if (!source.value.trim()) {
        stopSpeech();
        setOutput("Перевод появится здесь", true);
        setStatus("");
        return;
      }
      scheduleTranslate();
    });

    source.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        translate();
      }
    });

    translateBtn.addEventListener("click", translate);

    speakBtn.addEventListener("click", () => {
      speakText(getTranslationText(), LANGS[targetLang].voice, speakTargetBtn);
    });

    speakTargetBtn.addEventListener("click", () => {
      speakText(getTranslationText(), LANGS[targetLang].voice, speakTargetBtn);
    });

    speakSourceBtn.addEventListener("click", () => {
      speakText(source.value, "ru-RU", speakSourceBtn);
    });

    clearBtn.addEventListener("click", () => {
      stopSpeech();
      source.value = "";
      charCount.textContent = "0";
      setOutput("Перевод появится здесь", true);
      setStatus("");
      source.focus();
    });

    copyBtn.addEventListener("click", async () => {
      const text = getTranslationText();
      if (!text) {
        setStatus("Нечего копировать.");
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        setStatus("Перевод скопирован.");
      } catch {
        setStatus("Не удалось скопировать текст.", true);
      }
    });

    window.addEventListener("beforeunload", stopSpeech);
  </script>
</body>
</html>
